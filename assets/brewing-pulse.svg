<svg width="620" height="90" viewBox="0 0 620 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="reveal">
      <rect x="37" y="25" width="0" height="45">
        <animate
          attributeName="width"
          values="0;546;546"
          keyTimes="0;0.35;1"
          dur="2.5s"
          repeatCount="1"
          fill="freeze"
          calcMode="spline"
          keySplines="0.4 0 0.2 1;0 0 1 1"
        />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#reveal)">
    <text x="310" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF">
      Brewing ideas. Building systems.
      <animate
        attributeName="opacity"
        values="1;0.55;1"
        keyTimes="0;0.5;1"
        dur="3s"
        begin="2.5s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      />
    </text>
  </g>
</svg>
